name: Release

# Attaches the Claude Code plugin archive to a GitHub release once a state reaches `main`: own
# manifest, build and dist-drift gates, then the packaging.
on:
  push:
    branches: [main]

# Two pushes to `main` must not overtake each other. `cancel-in-progress: false` only keeps the
# RUNNING run alive: GitHub holds a single pending run per group and cancels the waiting one when a
# newer push arrives, and a cancelled run is not a red run — so if that waiting run carried the only
# version bump, that version is never released and nothing turns red. Not configurable away.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # `gh release create` writes a tag and a release to this repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Before the build: the version this workflow releases is read out of a manifest.
      - run: node scripts/validate-manifests.mjs
      - run: npm run build
      # `ci.yml` is parallel with no `needs:`: it cannot block a release out of unverified `main`.
      - run: git diff --exit-code dist/
      # Its own step so tag and archive read one value and cannot disagree.
      - id: version
        run: |
          VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # The path list is explicit rather than zipping the tree and subtracting: the archive is the
      # plugin layer and nothing else, and no new top-level directory drifts in unnoticed. `-MM`
      # guards the list: a member that no longer matches is exit 18, not a green hollow archive.
      - run: zip -MM -r zendesk-plugin.zip .claude-plugin agents commands skills dist/plugin README.md LICENSE
      # `-MM` proves presence, not content: an emptied entrypoint bundles as an empty server.js.
      - run: unzip -p zendesk-plugin.zip dist/plugin/server.js | grep -q .
      # Idempotent through `view`/`upload --clobber`, so the job is re-runnable whole.
      # Why a release at all: one versioned ZIP per tag, grabbable without repacking, and a record
      # of what each release shipped. Not a customer install path — the one customer has no GitHub
      # account and this repo goes private. And it has no substitute: `git tag -l 'v*'` is 0 and
      # `gh release list` empty, because this step is the repo's only writer of a `v*` tag, so there
      # is no tag to check out and repack. Keeping it is the owner's decision of 2026-10-07.
      - name: Attach the archive to a GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" zendesk-plugin.zip --clobber
          else
            gh release create "v$VERSION" zendesk-plugin.zip \
              --title "v$VERSION" \
              --notes "Zendesk plugin v$VERSION. Kept for internal traceability. The plugin is distributed to the team through the PersoQua marketplace (private repo persoqua-marketplace, Claude Desktop Org-Sync)."
          fi
