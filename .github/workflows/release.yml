name: Release

# Publishes the Claude Code plugin archive once a state reaches `main`. CI already gates every
# push; this workflow adds only the packaging and the two deliveries (GitHub release, gateway).
on:
  push:
    branches: [main]

# Two pushes to `main` must not overtake each other: the gateway refuses a version it already
# holds. `cancel-in-progress: false` only keeps the RUNNING run alive: GitHub holds a single
# pending run per group and cancels the waiting one when a newer push arrives, and a cancelled run
# is not a red run — so if that waiting run carried the only version bump, that version is never
# published and nothing turns red. Not configurable away. Operator rule: release to `main` one
# push at a time, and after a burst check `gh release list` against .claude-plugin/plugin.json.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # `gh release create` writes a tag and a release to this repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Validate the plugin manifests BEFORE the build so a broken manifest fails fast — the
      # version this workflow publishes is read out of one of them.
      - run: node scripts/validate-manifests.mjs
      - run: npm run build
      # Dist-drift guard: the build must leave committed dist/ byte-identical, or a stale artifact
      # ships (the plugin runs from dist/, not src/).
      - run: git diff --exit-code dist/
      # The archive version and the release tag come from the manifest, so the tag can never
      # disagree with what Claude Code reads out of the plugin. `echo "version=$(…)"` stays green
      # under `bash -e` when the substitution produced nothing, and an empty version would tag
      # literally `v` and POST an empty X-Version — hence the explicit check.
      - id: version
        run: |
          VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          [ -n "$VERSION" ] || { echo "::error::Empty version in .claude-plugin/plugin.json."; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # The path list is written out rather than zipping the tree and subtracting: the archive is
      # the plugin layer and nothing else, so src/, tests/, scripts/ and .github/ stay out, and a
      # new top-level directory cannot drift into a release unnoticed. `-MM` turns the list into a
      # guard: plain `zip -r` exits 0 on a path that no longer matches, so a renamed directory would
      # publish a hollowed-out archive green. With `-MM` a missing member is exit 18.
      - run: zip -MM -r zendesk-plugin.zip .claude-plugin agents commands skills dist/plugin README.md LICENSE
      # `-MM` proves every member is present, not that it has content: an emptied entrypoint bundles
      # to an empty server.js, and with the committed dist/ emptied too the drift guard stays green.
      - run: unzip -p zendesk-plugin.zip dist/plugin/server.js | grep -q .
      # This runs BEFORE the gateway publish so the job is re-runnable as a whole: this half is
      # idempotent through `view`/`upload --clobber`, while the gateway keeps a version once it has
      # one and answers 409 from then on. In the other order an upload flake after a successful POST
      # wedged the release: the re-run met that 409, and the only way out was a version bump — the
      # "out of step" the concurrency note exists to prevent. Rejected: `X-Force` on retry, which
      # would silently overwrite a published archive, and a two-job split, which buys the same
      # resumability for an artifact hand-off and a second checkout.
      # Why a release at all: one versioned ZIP per tag, grabbable without repacking, and a record
      # of what each release shipped. Not a customer install path — the one customer has no GitHub
      # account and this repo goes private. And it has no substitute: `git tag -l 'v*'` is 0 and
      # `gh release list` empty, because this step is the repo's only writer of a `v*` tag, so there
      # is no tag to check out and repack. Keeping it is the owner's decision of 2026-10-07.
      - name: Attach the archive to a GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" zendesk-plugin.zip --clobber
          else
            gh release create "v$VERSION" zendesk-plugin.zip \
              --title "v$VERSION" \
              --notes "Zendesk plugin v$VERSION. Customers install it from the PersoQua plugin marketplace at https://plugins.persoqua.de. This archive is the same artifact, kept for internal traceability, not a customer install path, since customers have no GitHub account and this repository is private."
          fi
      # PLUGIN_GATEWAY_PUBLISH_TOKEN comes through `env:` like VERSION: an inline `${{ }}` writes it
      # into the generated script and into curl's argv, and a token holding a quote or a `$` would
      # break the quoting there. The gateway's status is the only verdict read, so 409 can be told
      # apart from every other failure; the timeouts keep a hung gateway from holding the job — and
      # with it the concurrency group — to the 6-hour limit.
      - name: Publish to the plugin gateway
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_TOKEN: ${{ secrets.PLUGIN_GATEWAY_PUBLISH_TOKEN }}
        run: |
          code=$(curl -sS -X POST https://plugins.persoqua.de/admin/publish \
            --connect-timeout 10 --max-time 300 \
            -H "Authorization: Bearer $PUBLISH_TOKEN" \
            -H "X-Plugin: zendesk" \
            -H "X-Version: $VERSION" \
            -H "Content-Type: application/zip" \
            --data-binary @zendesk-plugin.zip \
            -o publish-body.txt -w '%{http_code}')
          [ "$code" = "409" ] && { echo "::error::Version $VERSION is already published. Bump \"version\" in .claude-plugin/plugin.json."; exit 1; }
          [ "$code" = "200" ] || { echo "::error::Gateway publish of $VERSION failed: HTTP $code."; cat publish-body.txt; exit 1; }
