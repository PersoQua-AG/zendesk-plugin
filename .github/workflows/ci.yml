name: CI

on:
  push:
  pull_request:

# A second push to the same ref cancels the older in-flight run — the gate always
# reflects the newest commit rather than wasting a runner on a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The owner's no-Claude-attribution rule, enforced instead of remembered (#86). It is its own job,
  # not a step in build-test, so the verdict is legible on the PR as a named check and does not
  # queue behind npm ci — and so a red attribution does not read as a red build.
  #
  # A LOCAL HOOK IS NOT THE ANSWER HERE. It is the faster feedback, but `--no-verify` skips it and
  # the rule already failed once in a session that had every reason to know it. CI is the one that
  # cannot be skipped, so CI is where it lives. A hook may be added later; it would not replace this.
  attribution-guard:
    runs-on: ubuntu-latest
    steps:
      # Full history: the range below reaches back to the base commit, which a shallow clone lacks.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # BOTH EVENTS, because only one of them ever runs against the target branch. On a pull_request
      # the range is base..head, which is exactly the commits the merge would bring. On a push it is
      # the pushed range; `github.event.before` is all zeros for a newly created branch, and there
      # the range falls back to the default branch's merge base — the same set, computed the long
      # way. The script takes the range and has no default; see its header for why.
      - name: Resolve the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # A new branch (or a force-push whose old tip is gone): compare against the default
            # branch. This OVER-checks — a branch cut from development re-reads development's own
            # commits since main — and that is the safe direction. Measured on dd6e564:
            # `--range origin/main..origin/development` → 15 commits, clean, exit 0. If a trailer
            # ever lands on an integration branch, this fallback goes red until it is rewritten;
            # that is the rule working, not the job misfiring.
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            range="$(git merge-base FETCH_HEAD "$AFTER")..$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Checking $range"
      - run: node scripts/assert-no-attribution.mjs --range '${{ steps.range.outputs.range }}'
      # The pull request DESCRIPTION, through the same patterns. It is passed on stdin rather than
      # interpolated into the shell, so a body containing backticks or $( ) is text, not code.
      - name: Check the pull request description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" | node scripts/assert-no-attribution.mjs --stdin 'the pull request description'

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Reproducible install from the lockfile; any drift fails here.
      - run: npm ci
      # Validate the plugin manifests BEFORE build/test so a broken manifest fails fast.
      # `claude plugin validate --strict` is the ideal check, but the `claude` CLI is not
      # present on stock GitHub Actions runners, so this zero-dep Node script is the fallback:
      # it asserts both manifests parse as JSON and carry their required fields. See the script
      # header. Swap to `claude plugin validate` here once the CLI is available in CI.
      - run: node scripts/validate-manifests.mjs
      # Structural guard for the #9 defect class: a foreign call on the synchronous path of a
      # NESTED promise executor, whose synchronous throw rejects the inner promise while the one the
      # caller awaits never settles. Pure syntax walk over src/ with the TypeScript compiler API
      # (already a devDependency), so it needs no build and runs before one. See the script header.
      - run: npm run check:executors
      # Bound-port guard (#73, widened in #82): no fixed port on a bind call anywhere under
      # tests/, or a concurrent `vitest run` collides on it (#23). The caller names the tree, in
      # package.json; why that is so, why src/ stays out and what the scan misses is in the
      # script header.
      - run: npm run check:ports
      - run: npm run build
      # Dist-drift guard: the just-run build must leave committed dist/ byte-identical.
      # A source change without a matching dist rebuild would otherwise ship stale install
      # artifacts (the plugin runs from dist/, not src/).
      - run: git diff --exit-code dist/
      # Replaces `npm test` rather than joining it: `vitest run --coverage` runs the identical suite
      # and additionally enforces the thresholds in vitest.config.ts (100% on the OAuth login path,
      # a ratchet on the rest). Keeping both steps would run every test twice for no new signal, and
      # a threshold that only ever runs locally is a claim, not a gate.
      - run: npm run test:coverage
      # The release gate, end to end. `.mcpbignore` is an intention; the audit in
      # scripts/audit-bundle.mjs is the proof, and it is taken from the packed artifact. Running it
      # only at release time would mean discovering a leak in the tree that is already being
      # uploaded, so CI packs a real production bundle on every push and audits it. `npm run pack`
      # is the existing chain — prod-tree gate, mcpb pack, audit — not a second one beside it.
      # It runs last because `npm ci --omit=dev` removes the toolchain every step above needs.
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm run pack
